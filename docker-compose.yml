services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: notas
      POSTGRES_USER: notas
      POSTGRES_PASSWORD: notas
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notas -d notas"]
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
